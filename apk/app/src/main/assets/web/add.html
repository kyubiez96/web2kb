<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah — web2kb</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen">
  <nav class="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center gap-3 z-10">
    <a href="library.html" class="text-slate-600 dark:text-slate-300">←</a>
    <div class="font-semibold text-lg dark:text-white ml-2">Tambah URL</div>
  </nav>

  <main class="max-w-md mx-auto p-6">
    <label class="block text-sm font-medium mb-2 dark:text-slate-200">URL artikel / halaman</label>
    <input id="url" type="url" placeholder="https://example.com/artikel"
      class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">

    <button id="save" class="mt-4 w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium">Scrape & Simpan</button>

    <div id="status" class="mt-4 text-sm"></div>

    <div class="mt-6 p-3 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-900 dark:text-blue-200 text-xs">
      Proses scrape butuh 5-15 detik. Workers AI merangkum gratis, fallback kosong kalau gagal.
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const btn = document.getElementById("save");
    const status = document.getElementById("status");
    const urlInput = document.getElementById("url");

    btn.onclick = async () => {
      const u = urlInput.value.trim();
      if (!/^https?:\/\//i.test(u)) {
        toast("URL harus http/https", "error");
        return;
      }
      btn.disabled = true;
      btn.textContent = "Menyimpan... (5-15 detik)";
      status.textContent = "";
      status.className = "mt-4 text-sm text-slate-500 dark:text-slate-400";

      try {
        const r = await api("/scrape", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: u }),
        });
        status.textContent = "✓ Tersimpan: " + (r.title || r.id);
        status.className = "mt-4 text-sm text-green-600 dark:text-green-400";
        setTimeout(() => location.href = "article.html?id=" + encodeURIComponent(r.id), 600);
      } catch (e) {
        status.textContent = "✗ " + e.message;
        status.className = "mt-4 text-sm text-red-600 dark:text-red-400";
        btn.disabled = false;
        btn.textContent = "Scrape & Simpan";
      }
    };

    urlInput.focus();
  </script>
</body>
</html>

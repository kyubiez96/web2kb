<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings — web2kb</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen">
  <nav class="sticky top-0 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center gap-3 z-10">
    <a href="library.html" class="font-semibold text-lg dark:text-white">📚 web2kb</a>
    <div class="flex-1"></div>
  </nav>
  <main class="max-w-md mx-auto p-6">
    <h2 class="text-xl font-bold mb-1 dark:text-white">Settings</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Worker URL pribadi kamu. Disimpan lokal di HP ini saja.</p>

    <label class="block text-sm font-medium mb-2 dark:text-slate-200">Worker URL</label>
    <input id="worker_url" type="url" placeholder="https://web2kb.YOUR-SUBDOMAIN.workers.dev"
      class="w-full px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500">

    <button id="save" class="mt-3 w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium">Simpan</button>
    <button id="test" class="mt-2 w-full bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-100 py-2.5 rounded-lg font-medium">Test koneksi</button>

    <div id="status" class="mt-4 text-sm"></div>

    <div class="mt-8 p-4 rounded-lg bg-amber-50 dark:bg-amber-900/30 text-amber-900 dark:text-amber-200 text-sm">
      <strong>Belum punya Worker?</strong>
      Deploy sendiri dalam 1 menit. Buka
      <a href="https://github.com/kyubiez96/web2kb" class="underline">github.com/kyubiez96/web2kb</a>
      → folder <code>worker/</code> → README.
    </div>

    <div class="mt-4 text-xs text-slate-400 dark:text-slate-500 text-center">
      Versi 0.1.0
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    const input = document.getElementById("worker_url");
    input.value = getWorkerUrl();

    document.getElementById("save").onclick = () => {
      const v = input.value.trim().replace(/\/+$/, "");
      if (!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(v)) {
        toast("URL harus https://*.workers.dev", "error");
        return;
      }
      setWorkerUrl(v);
      toast("Tersimpan");
      setTimeout(() => location.href = "library.html", 600);
    };

    document.getElementById("test").onclick = async () => {
      const v = input.value.trim().replace(/\/+$/, "");
      const status = document.getElementById("status");
      status.textContent = "Menguji...";
      status.className = "mt-4 text-sm text-slate-500 dark:text-slate-400";
      try {
        setWorkerUrl(v);
        const r = await api("/health");
        status.textContent = "✓ " + JSON.stringify(r);
        status.className = "mt-4 text-sm text-green-600 dark:text-green-400";
      } catch (e) {
        status.textContent = "✗ " + e.message;
        status.className = "mt-4 text-sm text-red-600 dark:text-red-400";
      }
    };
  </script>
</body>
</html>

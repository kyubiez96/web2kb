plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

android {
    namespace "com.kyubiez96.web2kb"
    compileSdk 34

    defaultConfig {
        applicationId "com.kyubiez96.web2kb"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            // Auto-generated debug keystore
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    androidResources {
        noCompress "js", "html", "css"
    }
}

dependencies {
    // No AndroidX — plain android.* only.
}
